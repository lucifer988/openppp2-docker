name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
      - name: Run shellcheck
        run: shellcheck -x --severity=warning install_openppp2.sh config.sh lib/*.sh

  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
      - name: Check formatting (shfmt -i 2 -ci)
        run: shfmt -i 2 -ci -d install_openppp2.sh config.sh lib/*.sh

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq openssl uuid-runtime
      - name: Run bats
        run: bats --print-output-on-failure tests/
