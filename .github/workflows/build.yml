name: build

# 构建并发布 openppp2 容器镜像到 GHCR：
#   - buildx 构建（linux/amd64，本项目仅支持 amd64）
#   - 从上游 liulilittle/openppp2 解析最新 release 的 simd zip，并把它的 SHA256
#     作为 build-arg 传入，Dockerfile 内强制校验完整性
#   - 生成 SBOM + provenance 证明（buildkit attestations）
#   - Trivy 扫描镜像（HIGH/CRITICAL，结果上传到 code scanning）
#   - cosign keyless（OIDC）对镜像 digest 签名
# PR 只构建不推送，用于验证 Dockerfile。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless 需要 OIDC token
  security-events: write # 上传 Trivy SARIF 到 code scanning

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openppp2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream simd zip + sha256
        id: up
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/liulilittle/openppp2/releases/latest | jq -r .tag_name)"
          url="https://github.com/liulilittle/openppp2/releases/download/${tag}/openppp2-linux-amd64-simd.zip"
          curl -fsSL "$url" -o /tmp/ppp.zip
          sha="$(sha256sum /tmp/ppp.zip | awk '{print $1}')"
          echo "tag=$tag"  >> "$GITHUB_OUTPUT"
          echo "url=$url"  >> "$GITHUB_OUTPUT"
          echo "sha=$sha"  >> "$GITHUB_OUTPUT"
          echo "上游=${tag} sha256=${sha}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=upstream-${{ steps.up.outputs.tag }}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENPPP2_ZIP_URL=${{ steps.up.outputs.url }}
            OPENPPP2_ZIP_SHA256=${{ steps.up.outputs.sha }}
          # 证明（attestations）需要镜像 exporter；PR 只构建不推送，故仅在推送时开启
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Trivy image scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # 仅报告、不因上游 CVE 阻断发布；如需强制门禁改为 '1'
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Reminder — make GHCR package public (one-time, manual)
        if: github.event_name != 'pull_request'
        run: |
          echo "::notice::GHCR 包默认私有，且无法通过 REST API 改可见性。"
          echo "::notice::首次发布后，请到 https://github.com/users/${{ github.repository_owner }}/packages/container/openppp2/settings"
          echo "::notice::将 Package visibility 改为 Public（或 Inherit access from source repository），匿名 docker pull 才能成功。设一次即可。"
